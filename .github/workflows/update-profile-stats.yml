name: Update GitHub profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate profile statistics
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/generate-profile-stats.mjs

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/contribution-graph.svg
          if git diff --cached --quiet; then
            echo "Statistics have not changed."
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi
